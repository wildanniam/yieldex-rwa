[profile.default]
src = "src"
no_match_path = "test/fork/**"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
solc_version = "0.8.34"
evm_version = "cancun"
optimizer = true
via_ir = true
optimizer_runs = 200
bytecode_hash = "none"
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true

[fmt]
line_length = 110

[profile.fork]
no_match_path = "test/disabled/**"
match_path = "test/fork/**"
