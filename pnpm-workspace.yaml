  - packages/*
engineStrict: true
saveExact: true
allowBuilds:
  '@fission-ai/openspec': false
  '@foundry-rs/anvil': true
  '@foundry-rs/forge': true
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@copilotkit/a2ui-renderer@1.77.2'
  - '@copilotkit/core@1.77.2'
  - '@copilotkit/mcp-apps-renderer@1.77.2'
  - '@copilotkit/react-core@1.77.2'
  - '@copilotkit/react-ui@1.77.2'
  - '@copilotkit/runtime-client-gql@1.77.2'
  - '@copilotkit/runtime@1.77.2'
  - '@copilotkit/shared@1.77.2'
  - '@copilotkit/web-components@1.77.2'
  - '@copilotkit/web-inspector@1.77.2'
